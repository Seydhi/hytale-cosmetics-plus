<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <!-- Background Gradient -->
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6c5ce7;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0984e3;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffeaa7;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#fdcb6e;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background Rounded Square -->
  <rect x="0" y="0" width="512" height="512" rx="64" fill="url(#bgGradient)" />
  
  <!-- Crown -->
  <g filter="url(#shadow)">
    <path d="M 120 280 
             L 170 200 
             L 220 240 
             L 270 140 
             L 320 240 
             L 370 200 
             L 420 280
             L 360 320
             L 180 320 Z" 
          fill="url(#goldGradient)" 
          stroke="#2d3436" 
          stroke-width="6"
          stroke-linejoin="round"/>
    
    <!-- Crown Jewels -->
    <circle cx="270" cy="180" r="16" fill="#e74c3c" stroke="#2d3436" stroke-width="4"/>
    <circle cx="170" cy="200" r="10" fill="#3498db" stroke="#2d3436" stroke-width="3"/>
    <circle cx="370" cy="200" r="10" fill="#3498db" stroke="#2d3436" stroke-width="3"/>
    
    <!-- Crown Points Details -->
    <circle cx="170" cy="200" r="18" fill="none" stroke="#2d3436" stroke-width="3" opacity="0.5"/>
    <circle cx="370" cy="200" r="18" fill="none" stroke="#2d3436" stroke-width="3" opacity="0.5"/>
    
    <!-- Sparkles -->
    <path d="M 360 120 L 370 105 L 380 120 L 370 135 Z" fill="#fff" opacity="0.9"/>
    <path d="M 140 160 L 150 145 L 160 160 L 150 175 Z" fill="#fff" opacity="0.9"/>
    <path d="M 380 260 L 390 245 L 400 260 L 390 275 Z" fill="#fff" opacity="0.7"/>
    <path d="M 160 250 L 165 235 L 170 250 L 165 265 Z" fill="#fff" opacity="0.7"/>
  </g>
  
  <!-- Text -->
  <text x="270" y="420" 
        font-family="Arial, sans-serif" 
        font-size="96" 
        font-weight="bold" 
        fill="#ffffff" 
        text-anchor="middle"
        style="text-shadow: 4px 4px 8px rgba(0,0,0,0.4); letter-spacing: -2px;">
    CP
  </text>
  
  <!-- Small tagline -->
  <text x="270" y="470" 
        font-family="Arial, sans-serif" 
        font-size="28" 
        font-weight="normal" 
        fill="#ffffff" 
        text-anchor="middle"
        style="text-shadow: 2px 2px 4px rgba(0,0,0,0.3); opacity: 0.9;">
    Cosmetics
  </text>
</svg>
