<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <!-- Background Gradient -->
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6c5ce7;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0984e3;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="starGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffeaa7;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#fdcb6e;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background Circle -->
  <circle cx="128" cy="128" r="120" fill="url(#bgGradient)" />
  
  <!-- Crown -->
  <path d="M 64 140 
           L 85 100 
           L 106 120 
           L 128 70 
           L 150 120 
           L 171 100 
           L 192 140
           L 170 160
           L 86 160 Z" 
        fill="url(#starGradient)" 
        stroke="#2d3436" 
        stroke-width="3"
        stroke-linejoin="round"/>
  
  <!-- Crown Jewels -->
  <circle cx="128" cy="90" r="8" fill="#e74c3c" stroke="#2d3436" stroke-width="2"/>
  <circle cx="85" cy="100" r="5" fill="#3498db" stroke="#2d3436" stroke-width="2"/>
  <circle cx="171" cy="100" r="5" fill="#3498db" stroke="#2d3436" stroke-width="2"/>
  
  <!-- Sparkles -->
  <path d="M 180 60 L 185 55 L 190 60 L 185 65 Z" fill="#fff" opacity="0.8"/>
  <path d="M 70 80 L 73 75 L 76 80 L 71 83 Z" fill="#fff" opacity="0.8"/>
  <path d="M 190 130 L 194 125 L 198 130 L 193 135 Z" fill="#fff" opacity="0.6"/>
  
  <!-- Text (CP initials) -->
  <text x="128" y="210" 
        font-family="Arial, sans-serif" 
        font-size="48" 
        font-weight="bold" 
        fill="#ffffff" 
        text-anchor="middle"
        style="text-shadow: 2px 2px 4px rgba(0,0,0,0.3);">
    CP
  </text>
</svg>
